name: H1 Changed Check

on:
  push:
  pull_request:

jobs:
  check-name-changed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check index.html
        run: |
          test -f index.html
          echo "index.html exists"

      - name: Check dummy2.html
        run: |
          test -f dummy2.html
          echo "dummy2.html exists"

      - name: Check H1 exists
        run: |
          grep -qi "<h1>" index.html
          echo "H1 tag exists in index.html"

      - name: Test completed
        run: echo "H1 check completed successfully!"